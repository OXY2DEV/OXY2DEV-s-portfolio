<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		/*@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Emoji:wght@300..700&display=swap");*/
	</style>

    <title>Vite + TS</title>
  </head>
  <body>
    <div id="page">
		<div id="loader">
			<div class="atom">
				<div class="atom-container">
					<svg
						class="background"
						version="1.1"
						xmlns="http://www.w3.org/2000/svg"
						xmlns:xlink="http://www.w3.org/1999/xlink"
						x="0%" y="0%"
						width="100%" height="100%"
						viewBox="0 0 100.0 100.0"
						enable-background="new 0 0 100.0 100.0"
						xml:space="preserve">

						<path
							stroke="var(--fg)"
							fill-opacity="0.000"
							stroke-opacity="1.000"
							fill-rule="nonzero"
							stroke-width="10.0"
							stroke-linejoin="miter"
							stroke-linecap="butt"
							d="M50.04,20.00A30.00 30.00 -0.00 1 0 50.04,80.00"/>

						<path
							class="circle-right"
							stroke="var(--fg)"
							fill-opacity="0.000"
							stroke-opacity="1.000"
							fill-rule="nonzero"
							stroke-width="10.0"
							stroke-linejoin="miter"
							stroke-linecap="butt"
							d="M50.00,20.00A30.00 30.00 -0.00 1 1 50.00,80.00"/>
					</svg>
					<div class="hider"></div>

					<div class="core"></div>
					<div class="orbit orbit-2">
						<div class="electron electron-3"></div>
						<div class="electron electron-4"></div>
						<div class="electron electron-5"></div>
						<div class="electron electron-6"></div>
						<div class="electron electron-7"></div>
						<div class="electron electron-8"></div>
					</div>

					<div class="orbit orbit-1">
						<div class="electron electron-1"></div>
						<div class="electron electron-2"></div>
					</div>
				</div>
			</div>
			<div class="loader-text"></div>
			<div class="loader-text-overlay"></div>
		</div>

		<div id="body"></div>
	</div>

    <script type="module" src="/src/scripts/main.ts"></script>
  </body>
</html>
